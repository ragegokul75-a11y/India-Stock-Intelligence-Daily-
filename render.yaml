services:
  - type: web
    name: india-stock-intelligence-daily
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.12.6
